name: todo-list-cicd

on:
    workflow_dispatch:
    push:
        branches:
            - 'feature/*'

env:
    MONGODB_URI:  ${{ secrets.MONGODB_URI }}

jobs:
    CI-Stage:
        name: CI Stage
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Docker Build For Testing
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/todo-list:${{ github.sha }}
        
        - name: Docker Image Testing
          run: |
            docker images
            docker run -itd --name todo-list -p 3000:3000 -e MONGODB_URI=$MONGODB_URI \
                ${{ vars.DOCKERHUB_USERNAME }}/todo-list:${{ github.sha }}
            
            export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' todo-list)
            echo $IP

            echo Testing Image URI using wget
            wget -q -O - 127.0.0.1:3000/health | grep health
